[project]
name = "trackflow-api"
version = "2.0.0"
description = "TrackFlow API — Incident Analyzer + Supplier Directory"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "tinydb>=4.8.0",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.3",
    "python-dotenv>=1.2.2",
    "resend>=2.39.0",
    "trackflow-shared @ file:///workspaces/aie-pt-2-Carles-Sanchez-Empresa/packages/shared-py/",
    "sqlmodel>=0.0.42",
    "psycopg2-binary>=2.9.12",
]

[tool.setuptools]
py-modules = ["seed", "seed_inventory"]

[project.scripts]
seed = "seed:seed"
seed-inventory = "seed_inventory:seed"
