# ─────────────────────────────────────────────────────────────
# docker-compose.yml — TrackFlow Monorepo
# Entorno de desarrollo reproducible para todo el equipo.
# Uso: docker compose up --build
# ─────────────────────────────────────────────────────────────

services:
  # ─── Servicio de interfaces (website + backoffice) ───────
  interfaces:
    build:
      context: .
      dockerfile: uis/Dockerfile
      target: deps  # Solo dependencias (dev, con bind mounts para recarga)
    container_name: trackflow-interfaces
    ports:
      - "3000:3000"   # website
      - "3001:3001"   # backoffice
    command: >
      sh -c "cd /app/uis/website && npx next dev --port 3000 &
             cd /app/uis/backoffice && npx next dev --port 3001 &
             wait"
    volumes:
      # Bind mounts para recarga en caliente
      - ./uis/website:/app/uis/website
      - ./uis/backoffice:/app/uis/backoffice
      - ./src:/app/src
      - ./packages/shared:/app/packages/shared
      - ./package.json:/app/package.json
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_HOST=api
      - NEXT_PUBLIC_API_PORT=8000
      # Ruta relativa: el rewrite de next.config.ts proxyea /telemetry → API interna
      - NEXT_PUBLIC_TELEMETRY_ENDPOINT=/telemetry/events
    networks:
      - trackflow-net

  # ─── Servicio backend (FastAPI) ──────────────────────────
  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: trackflow-api
    ports:
      - "8000:8000"
    volumes:
      # Bind mount para recarga en caliente (--reload)
      - ./services/api:/app/api
      # El bind mount anterior oculta los archivos copiados en /app/api.
      # Exponemos también el módulo Celery para que la API pueda encolar.
      - ./services/celery_app.py:/app/api/celery_app.py:ro
      - ./packages/shared-py:/app/packages/shared-py
    env_file:
      - .env
    environment:
      - TELEMETRY_ENDPOINT=/telemetry/events
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    networks:
      - trackflow-net

  redis:
    image: redis:7-alpine
    container_name: trackflow-redis
    command: redis-server --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    networks:
      - trackflow-net

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: trackflow-worker
    command: celery -A services.celery_app worker --loglevel=INFO -E
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis
    networks:
      - trackflow-net

  flower:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: trackflow-flower
    command: celery -A services.celery_app flower --port=5555 --persistent --db=/data/flower.db
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./data/flower:/data
    depends_on:
      - redis
    networks:
      - trackflow-net

# ─── Red Docker ────────────────────────────────────────────
networks:
  trackflow-net:
    name: trackflow-network
    driver: bridge