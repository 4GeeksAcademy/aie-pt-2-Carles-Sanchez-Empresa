<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="i18n-title" content="reset.title">
  <title>TrackFlow — Restablecer contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            secondary: '#10B981',
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <header class="bg-gradient-to-r from-blue-600 to-emerald-500 text-white p-6 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">🚚 TrackFlow</h1>
        <p class="text-blue-100 mt-1" data-i18n="app.admin_panel">Panel de administración</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="window.__toggleLang()" id="langToggle"
                class="bg-white/20 hover:bg-white/30 text-white px-2 py-1 rounded text-xs font-semibold font-mono tracking-wider transition">
          ES | EN
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-md">

      <!-- Tarjeta de restablecimiento -->
      <div id="resetCard" class="bg-white rounded-xl shadow-md border border-gray-200 p-8">
        <div class="text-center mb-6">
          <div class="text-5xl mb-3">🔐</div>
          <h2 class="text-2xl font-bold text-gray-800" data-i18n="reset.title">Crear nueva contraseña</h2>
          <p class="text-gray-500 text-sm mt-1" data-i18n="reset.subtitle">
            Introduce tu nueva contraseña para acceder a TrackFlow
          </p>
        </div>

        <!-- Error message -->
        <div id="resetError" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 text-red-700 text-sm text-center"></div>

        <form id="resetForm" class="space-y-4" novalidate>
          <!-- Nueva contraseña -->
          <div>
            <label for="passwordField" class="block text-sm font-medium text-gray-700 mb-1" data-i18n="reset.password_label">Nueva contraseña</label>
            <input
              id="passwordField"
              type="password"
              autocomplete="new-password"
              required
              minlength="6"
              placeholder="Mínimo 6 caracteres"
              data-i18n-placeholder="reset.password_placeholder"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            />
          </div>

          <!-- Confirmar contraseña -->
          <div>
            <label for="confirmField" class="block text-sm font-medium text-gray-700 mb-1" data-i18n="reset.confirm_label">Confirmar contraseña</label>
            <input
              id="confirmField"
              type="password"
              autocomplete="new-password"
              required
              minlength="6"
              placeholder="Repite la contraseña"
              data-i18n-placeholder="reset.confirm_placeholder"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            />
          </div>

          <!-- Submit -->
          <button
            id="resetBtn"
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm flex items-center justify-center gap-2"
          >
            <span id="resetBtnText" data-i18n="reset.submit">Restablecer contraseña</span>
            <span id="resetSpinner" class="hidden">
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
            </span>
          </button>
        </form>
      </div>

      <!-- Token missing state (se muestra si no hay token en la URL) -->
      <div id="missingTokenCard" class="hidden bg-white rounded-xl shadow-md border border-gray-200 p-8">
        <div class="text-center">
          <div class="text-5xl mb-3">⚠️</div>
          <h2 class="text-xl font-bold text-gray-800 mb-2" data-i18n="reset.invalid_link">Enlace inválido</h2>
          <p class="text-gray-500 text-sm mb-4" data-i18n="reset.invalid_link_desc">
            El enlace de restablecimiento no es válido o ha caducado. Solicita uno nuevo.
          </p>
          <a href="/forgot-password"
             class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-6 rounded-lg text-sm transition"
             data-i18n="reset.request_new_link">
            Solicitar nuevo enlace
          </a>
        </div>
      </div>

    </div>
  </main>

  <footer class="text-center text-gray-400 text-xs py-6 border-t border-gray-200" data-i18n="app.footer">
    TrackFlow — Panel de administración
  </footer>

  <script src="/js/i18n.js"></script>
  <script>
    // ── Leer token del query string ──
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const resetCard = document.getElementById('resetCard');
    const missingTokenCard = document.getElementById('missingTokenCard');
    const form = document.getElementById('resetForm');
    const passwordField = document.getElementById('passwordField');
    const confirmField = document.getElementById('confirmField');
    const resetBtn = document.getElementById('resetBtn');
    const resetBtnText = document.getElementById('resetBtnText');
    const resetSpinner = document.getElementById('resetSpinner');
    const resetError = document.getElementById('resetError');

    // ── Si no hay token, mostrar mensaje de error ──
    if (!token) {
      resetCard.classList.add('hidden');
      missingTokenCard.classList.remove('hidden');
    } else {
      resetCard.classList.remove('hidden');
      missingTokenCard.classList.add('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resetError.classList.add('hidden');

      const newPassword = passwordField.value;
      const confirmPassword = confirmField.value;

      if (!newPassword || newPassword.length < 6) {
        resetError.textContent = window.__('reset.password_min_length');
        resetError.classList.remove('hidden');
        return;
      }

      if (newPassword !== confirmPassword) {
        resetError.textContent = window.__('reset.passwords_mismatch');
        resetError.classList.remove('hidden');
        return;
      }

      // Estado loading y desactivar formulario
      resetBtn.disabled = true;
      resetBtnText.textContent = window.__('reset.submitting');
      resetSpinner.classList.remove('hidden');

      try {
        const res = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPassword }),
        });

        if (res.ok) {
          // Éxito — redirigir a login con mensaje
          window.location.href = '/login?reason=password_reset';
        } else {
          const data = await res.json();
          const detail = data.detail || window.__('reset.link_invalid');
          showError(detail);
        }
      } catch (err) {
        showError(window.__('reset.connection_error'));
      } finally {
        resetBtn.disabled = false;
        resetBtnText.textContent = 'Restablecer contraseña';
        resetSpinner.classList.add('hidden');
      }
    });

    function showError(msg) {
      resetError.innerHTML = msg + ' <a href="/forgot-password" class="underline font-medium">Solicitar un nuevo enlace</a>';
      resetError.classList.remove('hidden');
    }
  </script>

</body>
</html>
