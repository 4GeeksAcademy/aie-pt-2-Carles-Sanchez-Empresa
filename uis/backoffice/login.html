<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackFlow — Iniciar sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            secondary: '#10B981',
          }
        }
      }
    };

    // ── Si ya hay sesión válida, redirigir inmediatamente sin mostrar el login ──
    (function () {
      function decodeBase64Url(base64Url) {
        var normalized = String(base64Url || '').replace(/-/g, '+').replace(/_/g, '/');
        while (normalized.length % 4 !== 0) normalized += '=';
        return atob(normalized);
      }

      function isExpiredJwt(token) {
        if (!token || typeof token !== 'string') return true;
        var parts = token.split('.');
        if (parts.length !== 3) return true;
        try {
          var payload = JSON.parse(decodeBase64Url(parts[1]));
          if (typeof payload.exp !== 'number') return true;
          var now = Math.floor(Date.now() / 1000);
          return payload.exp <= now;
        } catch (e) {
          return true;
        }
      }

      var token = null;
      try { token = localStorage.getItem('trackflow_token'); } catch (e) {}
      if (token && !isExpiredJwt(token)) {
        var params = new URLSearchParams(window.location.search);
        window.location.href = params.get('redirect') || '/';
        return;
      }

      if (token) {
        try { localStorage.removeItem('trackflow_token'); } catch (e) {}
      }
    })();
  </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <header class="bg-gradient-to-r from-blue-600 to-emerald-500 text-white p-6 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">🚚 TrackFlow</h1>
        <p class="text-blue-100 mt-1">Panel de administración</p>
      </div>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-md">

      <!-- Tarjeta de login -->
      <div class="bg-white rounded-xl shadow-md border border-gray-200 p-8">
        <div class="text-center mb-6">
          <div class="text-5xl mb-3">🔐</div>
          <h2 class="text-2xl font-bold text-gray-800">Iniciar sesión</h2>
          <p class="text-gray-500 text-sm mt-1">Accede al panel de administración de TrackFlow</p>
        </div>

        <form id="loginForm" class="space-y-4">
          <!-- Email -->
          <div>
            <label for="emailField" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input
              id="emailField"
              type="email"
              autocomplete="email"
              required
              placeholder="tu@email.com"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            />
          </div>

          <!-- Password -->
          <div>
            <label for="passwordField" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input
              id="passwordField"
              type="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            />
          </div>

          <!-- Error feedback -->
          <div id="loginError" class="hidden bg-red-50 border border-red-200 rounded-lg p-3 text-red-700 text-sm"></div>

          <!-- Submit -->
          <button
            id="loginBtn"
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm flex items-center justify-center gap-2"
          >
            <span id="loginBtnText">Iniciar sesión</span>
            <span id="loginSpinner" class="hidden">
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
            </span>
          </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-4">
          <a href="/forgot-password" class="text-blue-600 hover:text-blue-800 font-medium underline decoration-blue-300 underline-offset-2">
            ¿Olvidaste tu contraseña?
          </a>
        </p>

        <p class="text-center text-sm text-gray-500 mt-4">
          ¿No tienes cuenta?
          <a href="/register" class="text-blue-600 hover:text-blue-800 font-medium underline decoration-blue-300 underline-offset-2">
            Registrarse
          </a>
        </p>
      </div>
    </div>
  </main>

  <footer class="text-center text-gray-400 text-xs py-6 border-t border-gray-200">
    TrackFlow — Panel de administración
  </footer>

  <script src="/js/app.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const emailField = document.getElementById('emailField');
    const passwordField = document.getElementById('passwordField');
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnText = document.getElementById('loginBtnText');
    const loginSpinner = document.getElementById('loginSpinner');
    const loginError = document.getElementById('loginError');

    // Leer redirect de la URL
    const params = new URLSearchParams(window.location.search);
    const redirectTo = params.get('redirect') || '/';

    // Si hay reason=password_reset, mostrar mensaje de éxito
    if (params.get('reason') === 'password_reset') {
      loginError.classList.remove('hidden');
      loginError.className = 'bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-emerald-700 text-sm';
      loginError.textContent = '✅ Contraseña actualizada correctamente. Inicia sesión con tu nueva contraseña.';
    }

    // Si hay reason=session_expired, mostrar mensaje
    if (params.get('reason') === 'session_expired') {
      loginError.classList.remove('hidden');
      loginError.className = 'bg-red-50 border border-red-200 rounded-lg p-3 text-red-700 text-sm';
      loginError.textContent = '⏰ Tu sesión ha expirado. Inicia sesión de nuevo.';
    }

    // Si ya hay token, redirigir directamente
    if (window.getToken && window.getToken()) {
      window.location.href = redirectTo;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');

      const email = emailField.value.trim();
      const password = passwordField.value;

      // Validaciones básicas
      if (!email) {
        showFieldError('Introduce tu email.');
        return;
      }
      if (!password) {
        showFieldError('Introduce tu contraseña.');
        return;
      }

      // Estado loading
      loginBtn.disabled = true;
      loginBtnText.textContent = 'Iniciando sesión…';
      loginSpinner.classList.remove('hidden');

      try {
        await window.login(email, password);
        // Éxito — redirigir
        window.location.href = redirectTo;
      } catch (err) {
        const msg = err instanceof Error ? err.message : 'Error desconocido';
        showFieldError(msg);
      } finally {
        loginBtn.disabled = false;
        loginBtnText.textContent = 'Iniciar sesión';
        loginSpinner.classList.add('hidden');
      }
    });

    function showFieldError(msg) {
      loginError.classList.remove('hidden');
      loginError.textContent = '❌ ' + msg;
    }
  </script>
</body>
</html>
