<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackFlow — Recuperar contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            secondary: '#10B981',
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <header class="bg-gradient-to-r from-blue-600 to-emerald-500 text-white p-6 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">🚚 TrackFlow</h1>
        <p class="text-blue-100 mt-1">Panel de administración</p>
      </div>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-6">
    <div class="w-full max-w-md">

      <!-- Tarjeta de recuperación -->
      <div class="bg-white rounded-xl shadow-md border border-gray-200 p-8">
        <div class="text-center mb-6">
          <div class="text-5xl mb-3">🔑</div>
          <h2 class="text-2xl font-bold text-gray-800">Recuperar contraseña</h2>
          <p class="text-gray-500 text-sm mt-1">
            Introduce tu email y te enviaremos un enlace para restablecer tu contraseña
          </p>
        </div>

        <form id="forgotPasswordForm" class="space-y-4">
          <!-- Email -->
          <div>
            <label for="emailField" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input
              id="emailField"
              type="email"
              autocomplete="email"
              required
              placeholder="tu@email.com"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
            />
          </div>

          <!-- Feedback mensaje de confirmación (oculto hasta envío) -->
          <div id="successMessage" class="hidden bg-emerald-50 border border-emerald-200 rounded-lg p-4 text-emerald-700 text-sm text-center">
            ✅ Formulario rellenado correctamente, recibirás un enlace en breves
          </div>

          <!-- Error feedback -->
          <div id="forgotError" class="hidden bg-red-50 border border-red-200 rounded-lg p-3 text-red-700 text-sm"></div>

          <!-- Submit -->
          <button
            id="forgotBtn"
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm flex items-center justify-center gap-2"
          >
            <span id="forgotBtnText">Enviar enlace</span>
            <span id="forgotSpinner" class="hidden">
              <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
              </svg>
            </span>
          </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
          ¿Recordaste tu contraseña?
          <a href="/login" class="text-blue-600 hover:text-blue-800 font-medium underline decoration-blue-300 underline-offset-2">
            Iniciar sesión
          </a>
        </p>
      </div>
    </div>
  </main>

  <footer class="text-center text-gray-400 text-xs py-6 border-t border-gray-200">
    TrackFlow — Panel de administración
  </footer>

  <script>
    const form = document.getElementById('forgotPasswordForm');
    const emailField = document.getElementById('emailField');
    const forgotBtn = document.getElementById('forgotBtn');
    const forgotBtnText = document.getElementById('forgotBtnText');
    const forgotSpinner = document.getElementById('forgotSpinner');
    const forgotError = document.getElementById('forgotError');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      forgotError.classList.add('hidden');
      successMessage.classList.add('hidden');

      const email = emailField.value.trim();

      if (!email) {
        forgotError.textContent = 'Introduce tu email.';
        forgotError.classList.remove('hidden');
        return;
      }

      // Estado loading y desactivar formulario para evitar duplicados
      forgotBtn.disabled = true;
      forgotBtnText.textContent = 'Enviando…';
      forgotSpinner.classList.remove('hidden');
      emailField.disabled = true;

      try {
        const res = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });

        // Siempre mostramos el mismo mensaje de confirmación
        // independientemente del resultado
        successMessage.classList.remove('hidden');
        forgotBtnText.textContent = 'Enviado';
      } catch (err) {
        // Si hay un error de red, también mostramos confirmación
        // para no filtrar información
        successMessage.classList.remove('hidden');
        forgotBtnText.textContent = 'Enviado';
      }
    });
  </script>

</body>
</html>
