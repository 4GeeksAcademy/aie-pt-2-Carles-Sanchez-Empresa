<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackFlow — Mi perfil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body.auth-pending {
      visibility: hidden;
    }

    .auth-ok body.auth-pending {
      visibility: visible;
    }
  </style>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
            secondary: '#10B981',
          }
        }
      }
    };

    // ── Protección inmediata: validar JWT antes de pintar el body ──
    (function () {
      try {
      function decodeBase64Url(base64Url) {
        var normalized = String(base64Url || '').replace(/-/g, '+').replace(/_/g, '/');
        while (normalized.length % 4 !== 0) normalized += '=';
        return atob(normalized);
      }

      function isExpiredJwt(token) {
        if (!token || typeof token !== 'string') return true;
        var parts = token.split('.');
        if (parts.length !== 3) return true;
        try {
          var payload = JSON.parse(decodeBase64Url(parts[1]));
          if (typeof payload.exp !== 'number') return true;
          var now = Math.floor(Date.now() / 1000);
          return payload.exp <= now;
        } catch (e) {
          return true;
        }
      }

      var loginUrl = '/login?redirect=' + encodeURIComponent(window.location.pathname);
      var token = null;
      try { token = localStorage.getItem('trackflow_token'); } catch (e) {}
      if (!token || isExpiredJwt(token)) {
        try { localStorage.removeItem('trackflow_token'); } catch (e) {}
        window.location.replace(loginUrl);
        return;
      }

      document.documentElement.classList.add('auth-ok');
      } catch (e) {
        document.documentElement.classList.add('auth-ok');
        window.location.replace('/login?redirect=' + encodeURIComponent(window.location.pathname));
      }
    })();
  </script>
</head>
<body class="auth-pending bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

  <header class="bg-gradient-to-r from-blue-600 to-emerald-500 text-white p-6 shadow-lg">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">🚚 TrackFlow</h1>
        <p class="text-blue-100 mt-1">Mi perfil</p>
      </div>
      <div class="flex items-center gap-3">
        <a href="/"
           class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
          🏠 Volver al inicio
        </a>
        <button onclick="window.logout()"
                class="bg-red-400/20 hover:bg-red-400/30 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
          🚪 Cerrar sesión
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-3xl mx-auto p-6 w-full">
    <!-- Loading -->
    <div id="loadingState" class="text-center py-12 text-gray-400">
      <p class="text-lg">⏳ Cargando perfil...</p>
    </div>

    <!-- Error -->
    <div id="errorState" class="hidden bg-red-50 border border-red-200 rounded-xl p-4 text-red-700 text-sm"></div>

    <!-- Profile content -->
    <div id="profileContent" class="hidden space-y-6">

      <!-- Tarjeta de información de usuario -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-blue-500"></span>
          Información de la cuenta
        </h2>
        <div class="space-y-3">
          <div class="flex items-center gap-2">
            <span class="text-gray-500 text-sm font-medium w-24">Email:</span>
            <span id="userEmail" class="text-gray-800 font-mono text-sm"></span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-gray-500 text-sm font-medium w-24">Rol:</span>
            <span id="userRole" class="text-gray-800 text-sm"></span>
          </div>
        </div>
      </div>

      <!-- Tarjeta de perfil (editable) -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
        <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
          Datos de contacto
        </h2>

        <form id="profileForm" class="space-y-4">
          <div>
            <label for="profileName" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
            <input
              id="profileName"
              type="text"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition"
              placeholder="Tu nombre"
            />
          </div>
          <div>
            <label for="profilePhone" class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
            <input
              id="profilePhone"
              type="tel"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition"
              placeholder="+34 600 000 000"
            />
          </div>
          <div>
            <label for="profileAddress" class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
            <input
              id="profileAddress"
              type="text"
              class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition"
              placeholder="Calle, ciudad, código postal"
            />
          </div>

          <div id="profileFeedback" class="hidden text-sm"></div>

          <button
            type="submit"
            id="saveProfileBtn"
            class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2.5 rounded-lg text-sm font-semibold transition shadow-sm flex items-center gap-2"
          >
            💾 Guardar cambios
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="text-center text-gray-400 text-xs py-6 border-t border-gray-200">
    TrackFlow — Panel de administración
  </footer>

  <script src="/js/app.js"></script>
  <script>
    // ── Proteger página ──
    window.requireAuth();

    // ── Referencias DOM ──
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');
    const profileContent = document.getElementById('profileContent');
    const userEmail = document.getElementById('userEmail');
    const userRole = document.getElementById('userRole');
    const profileName = document.getElementById('profileName');
    const profilePhone = document.getElementById('profilePhone');
    const profileAddress = document.getElementById('profileAddress');
    const profileForm = document.getElementById('profileForm');
    const profileFeedback = document.getElementById('profileFeedback');
    const saveProfileBtn = document.getElementById('saveProfileBtn');

    let currentProfile = null;

    // ── Cargar datos ──
    async function loadProfile() {
      try {
        const authMe = await window.getAuthMe();
        userEmail.textContent = authMe.email;
        userRole.textContent = authMe.role === 'admin' ? 'Administrador' : authMe.role === 'manager' ? 'Gestor' : 'Usuario';

        if (authMe.profile) {
          currentProfile = authMe.profile;
          profileName.value = authMe.profile.name || '';
          profilePhone.value = authMe.profile.phone || '';
          profileAddress.value = authMe.profile.address || '';
        }

        loadingState.classList.add('hidden');
        profileContent.classList.remove('hidden');
      } catch (err) {
        loadingState.classList.add('hidden');
        errorState.classList.remove('hidden');
        errorState.textContent = '❌ Error al cargar perfil: ' + (err instanceof Error ? err.message : String(err));
      }
    }

    // ── Guardar perfil ──
    profileForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      profileFeedback.classList.add('hidden');

      const data = {
        name: profileName.value.trim() || '',
        phone: profilePhone.value.trim() || '',
        address: profileAddress.value.trim() || '',
      };

      saveProfileBtn.disabled = true;
      saveProfileBtn.innerHTML = '⏳ Guardando…';

      try {
        const updated = await window.updateProfile(data);
        currentProfile = updated;
        profileFeedback.className = 'text-sm text-emerald-600';
        profileFeedback.textContent = '✅ Perfil actualizado correctamente';
        profileFeedback.classList.remove('hidden');
      } catch (err) {
        profileFeedback.className = 'text-sm text-red-500';
        profileFeedback.textContent = '❌ ' + (err instanceof Error ? err.message : 'Error al guardar');
        profileFeedback.classList.remove('hidden');
      } finally {
        saveProfileBtn.disabled = false;
        saveProfileBtn.innerHTML = '💾 Guardar cambios';
      }
    });

    // ── Inicializar ──
    loadProfile();
  </script>
</body>
</html>
