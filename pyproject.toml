[project]
name = "trackflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "cachetools>=7.2.0",
    "celery[redis]>=5.4.0",
    "fastapi>=0.141.1",
    "libpass>=1.9.3",
    "matplotlib>=3.11.2",
    "openai>=3.29.0",
    "pandas>=3.0.6",
    "prefect>=3",
    "psycopg2-binary>=2.9.13",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "resend>=2.47.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.42",
    "tinydb>=4.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
